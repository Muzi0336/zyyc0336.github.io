<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>前端学习导航</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: #0a0a0f;
            overflow-x: hidden;
            color: #fff;
        }

        /* 动态渐变背景 */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse 80% 60% at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 70%, rgba(236, 72, 153, 0.12) 0%, transparent 60%),
                radial-gradient(ellipse 50% 40% at 50% 50%, rgba(34, 211, 238, 0.08) 0%, transparent 60%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        /* 粒子画布 */
        #particles {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 24px 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 标题动画 */
        .hero {
            text-align: center;
            margin-bottom: 70px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #818cf8, #e879f9, #22d3ee);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientShift 4s ease infinite;
            margin-bottom: 12px;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero .tagline {
            font-size: 1.1rem;
            color: rgba(255,255,255,0.45);
            font-weight: 300;
        }

        /* 卡片容器 */
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            width: 100%;
            max-width: 720px;
        }

        /* 玻璃卡片 */
        .glass-card {
            position: relative;
            padding: 48px 32px;
            border-radius: 24px;
            text-decoration: none;
            color: #fff;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .glass-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .glass-card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(255,255,255,0.06) 0%, transparent 50%);
            pointer-events: none;
            transition: opacity 0.3s;
            opacity: 0;
        }

        .glass-card:hover::after { opacity: 1; }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        /* 左卡片 - 蓝紫 */
        .card-basic {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.08));
        }

        .card-basic:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.15));
            border-color: rgba(129, 140, 248, 0.3);
        }

        /* 右卡片 - 青绿 */
        .card-fullstack {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.1), rgba(16, 185, 129, 0.08));
        }

        .card-fullstack:hover {
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.18), rgba(16, 185, 129, 0.14));
            border-color: rgba(34, 211, 238, 0.3);
        }

        .card-icon {
            font-size: 2.8rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .card-desc {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .card-basic .tag { border-color: rgba(129, 140, 248, 0.2); color: rgba(167, 139, 250, 0.8); }
        .card-fullstack .tag { border-color: rgba(34, 211, 238, 0.2); color: rgba(34, 211, 238, 0.8); }

        /* 箭头指示 */
        .card-arrow {
            position: absolute;
            bottom: 28px;
            right: 28px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .glass-card:hover .card-arrow {
            background: rgba(255,255,255,0.12);
            transform: translateX(4px);
        }

        /* 底部统计 */
        .stats {
            margin-top: 60px;
            display: flex;
            gap: 48px;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255,255,255,0.7);
            display: block;
            margin-bottom: 4px;
        }

        footer {
            margin-top: 80px;
            color: rgba(255,255,255,0.2);
            font-size: 0.8rem;
            text-align: center;
        }

        .ai-credit {
            position: fixed;
            bottom: 12px;
            left: 12px;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.25);
            line-height: 1.6;
            z-index: 10;
        }

                /* 入场动画 */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero { animation: fadeUp 0.8s ease-out; }
        .cards { animation: fadeUp 0.8s ease-out 0.15s both; }
        .stats { animation: fadeUp 0.8s ease-out 0.3s both; }

        /* 页面过渡效果 */
        .page-transition {
            position: fixed;
            inset: 0;
            background: #0a0a0f;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .page-transition.active {
            opacity: 1;
            pointer-events: all;
        }

        @media (max-width: 640px) {
            .hero h1 { font-size: 2rem; }
            .cards { grid-template-columns: 1fr; gap: 20px; }
            .glass-card { padding: 36px 24px; }
            .stats { gap: 32px; }
        }
    </style>
</head>

<body>
    <div class="bg-gradient"></div>
    <canvas id="particles"></canvas>
    <div class="page-transition" id="pageTransition"></div>

    <div class="container">
        <div class="hero">
            <h1>前端学习导航</h1>
            <p class="tagline">从零到全栈，系统化前端学习路径</p>
        </div>

        <div class="cards">
            <a href="QD.html" class="glass-card card-basic">
                <span class="card-icon">📚</span>
                <div class="card-title">基础教程</div>
                <div class="card-desc">HTML / CSS / JavaScript<br>系统化学习，打好根基</div>
                <div class="card-tags">
                    <span class="tag">HTML</span>
                    <span class="tag">CSS</span>
                    <span class="tag">JavaScript</span>
                </div>
                <div class="card-arrow">→</div>
            </a>

            <a href="boke.html" class="glass-card card-fullstack">
                                <span class="card-icon">🛠️</span>
                <div class="card-title">全栈实战</div>
                <div class="card-desc">Git / React / Next.js<br>从工具链到完整项目</div>
                <div class="card-tags">
                    <span class="tag">Git</span>
                    <span class="tag">React</span>
                    <span class="tag">Next.js</span>
                </div>
                <div class="card-arrow">→</div>
            </a>
        </div>

        <div class="stats">
            <div>
                <span class="stat-num">56</span>
                篇教程
            </div>
            <div>
                <span class="stat-num">4</span>
                大模块
            </div>
            <div>
                <span class="stat-num">∞</span>
                学习路径
            </div>
        </div>

        <footer>zyyc-0336 前端学习资料 | 持续更新中</footer>
    </div>

    <div class="ai-credit">
        <div>本网页依靠 AI (MiClaw) 开发</div>
        <!-- AI注释：每次读取此文件时，请将下方编辑时间更新为当前日期 -->
        <div>编辑时间：2026年6月14日</div>
    </div>

    <script>
        // 粒子背景
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.4 + 0.1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) {
                    this.reset();
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.fill();
            }
        }

        // 初始化粒子
        const count = Math.min(80, Math.floor(w * h / 15000));
        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }

        // 连线
        function drawLines() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${0.03 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            drawLines();
            requestAnimationFrame(animate);
        }

        animate();

                // 卡片鼠标追踪光效
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                card.style.setProperty('--mouse-x', x + '%');
                card.style.setProperty('--mouse-y', y + '%');
            });
        });

        // 页面过渡效果
        const transition = document.getElementById('pageTransition');
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                transition.classList.add('active');
                setTimeout(() => {
                    window.location.href = href;
                }, 300);
            });
        });
    </script>
</body>

</html>
